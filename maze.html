<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미로 화면</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        #maze {
            display: grid;
            gap: 1px;
            background-color: #000;
            padding: 5px;
            border: 2px solid #555;
            margin-top: 20px;
        }
        .cell {
            width: 18px;
            height: 18px;
            background-color: #fff; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }
        .wall { background-color: #333; } 
        .player-start { 
            background-color: #ff4757; 
            color: white; 
            border-radius: 50%; 
        }
        .exit { 
            background-color: #2ed573; 
            color: white; 
        }
    </style>
</head>
<body>

    <h1>미로 맵 (35x35)</h1>
    <div id="maze"></div>

    <script>
        
        const mazeSize = 35; 

        
        function generateMazeDesign(size) {
            let maze = Array.from({ length: size }, () => Array(size).fill(1)); 

            function shuffle(array) {
                return array.sort(() => Math.random() - 0.5);
            }

            function carve(r, c) {
                maze[r][c] = 0; 
                const directions = shuffle([
                    [-2, 0], [2, 0], [0, -2], [0, 2]
                ]);

                for (let [dr, dc] of directions) {
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr > 0 && nr < size - 1 && nc > 0 && nc < size - 1 && maze[nr][nc] === 1) {
                        maze[r + dr / 2][c + dc / 2] = 0; 
                        carve(nr, nc);
                    }
                }
            }

            carve(1, 1); 

            
            maze[1][1] = 2; 
            maze[size - 2][size - 2] = 3; 

            return maze;
        }

        
        function displayMazeDesign(size) {
            const map = generateMazeDesign(size);
            const mazeElement = document.getElementById('maze');
            
            mazeElement.innerHTML = ''; 
            mazeElement.style.gridTemplateColumns = `repeat(${size}, 18px)`; 

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cellType = map[r][c];
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    if (cellType === 1) {
                        cell.classList.add('wall');
                    } else if (cellType === 2) {
                        cell.classList.add('player-start');
                        cell.innerText = 'P'; 
                    } else if (cellType === 3) {
                        cell.classList.add('exit');
                        cell.innerText = 'E'; 
                    }
                    mazeElement.appendChild(cell);
                }
            }
        }
        displayMazeDesign(mazeSize);
    </script>
</body>
</html>
